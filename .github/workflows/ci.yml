name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexa?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nexa?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexa_test?schema=public
      AUTH_SECRET: dummy-auth-secret-for-ci
      NEXTAUTH_URL: http://localhost:3000
      BANK_TIMEZONE: Asia/Dhaka

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexa"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE nexa_test;'

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexa_test?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/nexa_test?schema=public
        run: npx prisma migrate deploy

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
